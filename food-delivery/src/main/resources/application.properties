spring.application.name=food-delivery
server.port=8080

# MySQL connection - the database is created automatically if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

# Hibernate creates/updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Don't cache templates while developing (edit HTML, refresh browser)
spring.thymeleaf.cache=false
