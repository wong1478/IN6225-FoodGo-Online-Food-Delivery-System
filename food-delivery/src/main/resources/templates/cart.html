<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cart')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div th:replace="~{fragments :: messages}"></div>
    <h2>Your cart</h2>

    <div th:if="${cart.empty}" class="text-muted">
        Your cart is empty. <a th:href="@{/}">Browse restaurants</a>
    </div>

    <div th:unless="${cart.empty}" class="row g-4">
        <!-- Cart items -->
        <div class="col-lg-7">
            <p>From <strong th:text="${cart.restaurantName}">Restaurant</strong></p>
            <table class="table bg-white align-middle">
                <thead>
                <tr><th>Item</th><th>Price</th><th style="width: 150px;">Qty</th><th>Subtotal</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cart.items}">
                    <td th:text="${item.name}">Item</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(item.unitPrice, 1, 2)}"></td>
                    <td>
                        <form th:action="@{/cart/update}" method="post" class="d-flex gap-1">
                            <input type="hidden" name="menuItemId" th:value="${item.menuItemId}">
                            <input type="number" name="quantity" th:value="${item.quantity}" min="0" max="20"
                                   class="form-control form-control-sm" style="width: 65px;">
                            <button class="btn btn-sm btn-outline-secondary">Update</button>
                        </form>
                    </td>
                    <td th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="menuItemId" th:value="${item.menuItemId}">
                            <button class="btn btn-sm btn-link text-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <form th:action="@{/cart/clear}" method="post">
                <button class="btn btn-sm btn-outline-danger">Clear cart</button>
            </form>
        </div>

        <!-- Checkout -->
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5>Checkout</h5>
                    <form th:action="@{/cart/checkout}" method="post">
                        <!-- Delivery or in-store pickup -->
                        <label class="form-label">How do you want your food?</label>
                        <div class="btn-group w-100 mb-3" role="group">
                            <input type="radio" class="btn-check" name="fulfilmentType" value="DELIVERY" id="typeDelivery"
                                   checked onclick="setFulfilment(false)">
                            <label class="btn btn-outline-danger" for="typeDelivery">Delivery</label>
                            <input type="radio" class="btn-check" name="fulfilmentType" value="PICKUP" id="typePickup"
                                   onclick="setFulfilment(true)">
                            <label class="btn btn-outline-danger" for="typePickup">In-store pickup</label>
                        </div>

                        <table class="table table-sm">
                            <tr><td>Subtotal</td><td class="text-end" th:text="'$' + ${#numbers.formatDecimal(cart.subtotal, 1, 2)}"></td></tr>
                            <tr id="feeRow"><td>Delivery fee</td><td class="text-end" th:text="'$' + ${#numbers.formatDecimal(cart.deliveryFee, 1, 2)}"></td></tr>
                            <tr class="fw-bold"><td>Total</td><td class="text-end">
                                <span id="totalDelivery" th:text="'$' + ${#numbers.formatDecimal(cart.total, 1, 2)}"></span>
                                <span id="totalPickup" style="display: none;" th:text="'$' + ${#numbers.formatDecimal(cart.subtotal, 1, 2)}"></span>
                            </td></tr>
                        </table>

                        <div class="mb-3" id="addressBox">
                            <label class="form-label">Delivery address</label>
                            <input type="text" name="deliveryAddress" id="deliveryAddress" class="form-control"
                                   th:value="${defaultAddress}" required>
                        </div>
                        <div class="alert alert-light border small" id="pickupBox" style="display: none;">
                            Collect your order at <strong th:text="${cart.restaurantName}"></strong>
                            when it is marked "Ready for pickup".
                        </div>

                        <label class="form-label">Payment method</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="paymentMethod" value="CARD" id="payCard" checked
                                   onclick="document.getElementById('cardFields').style.display='block'">
                            <label class="form-check-label" for="payCard">Credit / debit card</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" value="CASH" id="payCash"
                                   onclick="document.getElementById('cardFields').style.display='none'">
                            <label class="form-check-label" for="payCash">Cash (pay on delivery / at pickup)</label>
                        </div>

                        <!-- Simulated payment: card number is checked but never stored -->
                        <div id="cardFields" class="border rounded p-2 mb-3 bg-light">
                            <input type="text" name="cardNumber" class="form-control mb-2" placeholder="Card number (16 digits)" maxlength="19">
                            <div class="d-flex gap-2">
                                <input type="text" class="form-control" placeholder="MM/YY" maxlength="5">
                                <input type="text" class="form-control" placeholder="CVV" maxlength="3">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Place order</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function setFulfilment(isPickup) {
        document.getElementById('addressBox').style.display = isPickup ? 'none' : 'block';
        document.getElementById('deliveryAddress').required = !isPickup;
        document.getElementById('pickupBox').style.display = isPickup ? 'block' : 'none';
        document.getElementById('feeRow').style.display = isPickup ? 'none' : '';
        document.getElementById('totalDelivery').style.display = isPickup ? 'none' : 'inline';
        document.getElementById('totalPickup').style.display = isPickup ? 'inline' : 'none';
    }
</script>
</body>
</html>
