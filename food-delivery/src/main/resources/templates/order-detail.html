<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order #' + ${order.id})}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 860px;">
    <div th:replace="~{fragments :: messages}"></div>

    <a th:href="@{/orders}" class="small">&larr; My orders</a>
    <div class="d-flex justify-content-between align-items-center mt-2">
        <h2 th:text="'Order #' + ${order.id}">Order</h2>
        <span class="fs-5" th:replace="~{fragments :: statusBadge(${order.status})}"></span>
    </div>
    <p class="text-muted">
        <span th:text="${order.restaurant.name}"></span> &middot;
        <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></span> &middot;
        <span class="badge bg-light text-dark border" th:text="${order.fulfilmentType.label}">Delivery</span>
    </p>

    <!-- Order tracking bar (4 steps for delivery or pickup) -->
    <div class="card shadow-sm mb-3" th:unless="${order.status.name() == 'CANCELLED'}">
        <div class="card-body">
            <h5>Order progress</h5>
            <div class="tracker">
                <div class="step" th:each="s, stat : ${order.trackingSteps}"
                     th:classappend="${stat.index <= order.currentStepIndex} ? 'done'">
                    <div class="dot" th:text="${stat.count}">1</div>
                    <span th:text="${s.label}">Step</span>
                </div>
            </div>
            <p class="mb-1" th:if="${order.status.name() == 'READY_FOR_PICKUP'}">
                Your food is ready! Collect it at <strong th:text="${order.restaurant.address}"></strong>.
            </p>
            <p class="mb-0 small text-muted" th:unless="${order.completed}">
                This page refreshes automatically every 15 seconds.
            </p>
        </div>
    </div>
    <div th:if="${order.status.name() == 'CANCELLED'}" class="alert alert-secondary">This order was cancelled.</div>

    <!-- Items + payment -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h5>Items</h5>
            <table class="table table-sm">
                <tr th:each="i : ${order.items}">
                    <td th:text="${i.quantity} + ' x ' + ${i.itemName}"></td>
                    <td class="text-end" th:text="'$' + ${#numbers.formatDecimal(i.lineTotal, 1, 2)}"></td>
                </tr>
                <tr th:unless="${order.pickup}"><td>Delivery fee</td><td class="text-end" th:text="'$' + ${#numbers.formatDecimal(order.deliveryFee, 1, 2)}"></td></tr>
                <tr class="fw-bold"><td>Total</td><td class="text-end" th:text="'$' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></td></tr>
            </table>
            <p class="mb-1" th:unless="${order.pickup}"><strong>Deliver to:</strong> <span th:text="${order.deliveryAddress}"></span></p>
            <p class="mb-1" th:if="${order.pickup}"><strong>Pick up at:</strong>
                <span th:text="${order.restaurant.name} + ', ' + ${order.restaurant.address}"></span></p>
            <p class="mb-0"><strong>Payment:</strong> <span th:text="${order.paymentMethod}"></span>
                - <span th:text="${order.paymentStatus}"></span></p>
        </div>
    </div>

    <!-- Cancel (only before the restaurant accepts) -->
    <form th:if="${order.status.name() == 'PLACED'}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post"
          onsubmit="return confirm('Cancel this order?');" class="mb-3">
        <button class="btn btn-outline-danger">Cancel order</button>
    </form>

    <!-- Feedback (only after delivery / pickup) -->
    <div class="card shadow-sm mb-4" th:if="${order.completed}">
        <div class="card-body">
            <h5>Your feedback</h5>
            <div th:if="${review != null}">
                <span class="stars" th:text="${#strings.repeat('★', review.rating)}"></span>
                <p class="mb-0" th:text="${review.comment}"></p>
            </div>
            <form th:if="${review == null}" th:action="@{/orders/{id}/review(id=${order.id})}" method="post">
                <div class="mb-2">
                    <label class="form-label">Rating</label>
                    <select name="rating" class="form-select" style="width: 160px;">
                        <option value="5">5 - Excellent</option>
                        <option value="4">4 - Good</option>
                        <option value="3">3 - Okay</option>
                        <option value="2">2 - Poor</option>
                        <option value="1">1 - Bad</option>
                    </select>
                </div>
                <div class="mb-2">
                    <textarea name="comment" class="form-control" rows="3" placeholder="How was your food and delivery?"></textarea>
                </div>
                <button class="btn btn-danger">Submit feedback</button>
            </form>
        </div>
    </div>
</div>

<!-- Simple "live" tracking: reload while the order is still in progress -->
<script th:if="${!order.completed and order.status.name() != 'CANCELLED'}">
    setTimeout(function () { location.reload(); }, 15000);
</script>
</body>
</html>
