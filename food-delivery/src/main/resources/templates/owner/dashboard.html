<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My Restaurant')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container">
    <div th:replace="~{fragments :: messages}"></div>
    <h2>My restaurant</h2>

    <div class="row g-4">
        <!-- Restaurant profile (create the first time, edit afterwards) -->
        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 th:text="${restaurant == null} ? 'Set up your restaurant' : 'Restaurant details'">Details</h5>
                    <form th:action="@{/owner/restaurant}" method="post">
                        <div class="mb-2">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" th:value="${restaurant?.name}" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Cuisine</label>
                            <input type="text" name="cuisine" class="form-control" th:value="${restaurant?.cuisine}">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Address</label>
                            <input type="text" name="address" class="form-control" th:value="${restaurant?.address}">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="2" th:text="${restaurant?.description}"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="open" value="true" id="open"
                                   th:checked="${restaurant == null or restaurant.open}">
                            <label class="form-check-label" for="open">Open for orders</label>
                        </div>
                        <button class="btn btn-danger">Save</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Menu management -->
        <div class="col-lg-7" th:if="${restaurant != null}">
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h5>Add menu item</h5>
                    <form th:action="@{/owner/menu}" method="post" class="row g-2">
                        <div class="col-md-5"><input type="text" name="name" class="form-control" placeholder="Name" required></div>
                        <div class="col-md-3"><input type="number" name="price" step="0.01" min="0.01" class="form-control" placeholder="Price" required></div>
                        <div class="col-md-4"><button class="btn btn-danger w-100">Add item</button></div>
                        <div class="col-12"><input type="text" name="description" class="form-control" placeholder="Description (optional)"></div>
                    </form>
                </div>
            </div>

            <table class="table bg-white align-middle">
                <thead><tr><th>Item</th><th>Price</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="item : ${menuItems}">
                    <td>
                        <strong th:text="${item.name}"></strong>
                        <div class="small text-muted" th:text="${item.description}"></div>
                    </td>
                    <td th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}"></td>
                    <td>
                        <span th:if="${item.available}" class="badge bg-success">On menu</span>
                        <span th:unless="${item.available}" class="badge bg-secondary">Hidden</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/owner/menu/{id}/edit(id=${item.id})}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <form th:action="@{/owner/menu/{id}/toggle(id=${item.id})}" method="post" class="d-inline">
                            <button class="btn btn-sm btn-outline-danger" th:text="${item.available} ? 'Hide' : 'Show'">Hide</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
